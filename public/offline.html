<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | No Internet Connection — TextToSpeechH AI</title>
  <meta name="description" content="Offline - No Internet Connection.">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; background: #0b0f19;">

  <div class="glass-panel" style="max-width: 580px; width: 100%; padding: 3rem 2.5rem; text-align: center; border-radius: 20px; border: 1px solid rgba(0, 242, 254, 0.2); background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(11, 15, 25, 0.95) 100%); shadow: 0 20px 50px rgba(0,0,0,0.5);">
    
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">📡</div>

    <h1 style="font-size: 1.8rem; color: #ffffff; margin-bottom: 1rem; font-weight: 700;">You Are Offline</h1>

    <p style="font-size: 1.05rem; color: #cbd5e1; line-height: 1.7; margin-bottom: 2rem;">
      You are currently disconnected from the internet. Please check your Wi-Fi router or mobile network settings to continue generating AI voiceovers.
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <button onclick="window.location.reload()" class="primary-btn" style="padding: 12px 28px; border-radius: 30px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 600;">
        ⚡ Retry Connection
      </button>
    </div>

    <div style="margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.85rem; color: #64748b;">
      TextToSpeechH AI automatically reconnects as soon as network access returns.
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
