<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VXH6Y61FQ0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VXH6Y61FQ0');
  </script>
  <!-- Microsoft Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xt0hsu1r65");
  </script>
  <title>Offline | No Internet Connection — TextToSpeechH AI</title>
  <meta name="description" content="Offline - No Internet Connection.">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function(){var t=localStorage.getItem('tts_theme');if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();
  </script>
</head>
<body>

  <div class="glass-panel" style="max-width: 580px; width: 100%; padding: 3rem 2.5rem; text-align: center; border-radius: 20px; border: 1px solid var(--color-border); background: var(--color-surface); box-shadow: var(--shadow-xl);">
    
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">📡</div>

    <h1 style="font-size: 1.8rem; color: var(--color-text); margin-bottom: 1rem; font-weight: 700;">You Are Offline</h1>

    <p style="font-size: 1.05rem; color: var(--color-text-secondary); line-height: 1.7; margin-bottom: 2rem;">
      You are currently disconnected from the internet. Please check your Wi-Fi router or mobile network settings to continue generating AI voiceovers.
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <button onclick="window.location.reload()" class="primary-btn" style="padding: 12px 28px; border-radius: 30px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 600;">
        ⚡ Retry Connection
      </button>
    </div>

    <div style="margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--color-border); font-size: 0.85rem; color: var(--color-text-muted);">
      TextToSpeechH AI automatically reconnects as soon as network access returns.
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
